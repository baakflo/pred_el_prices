name: Archive weather

on:
  schedule:
    # Three best-effort attempts (GitHub cron can be delayed or skipped);
    # the archiver is idempotent and exits fast once the day's file exists.
    # 00Z ICON-EU-EPS files are complete on DWD's server by ~05:30 UTC.
    - cron: "45 5 * * *"
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    # Last pre-gate attempt for the ENTSO-E forecast snapshot: gate is
    # 12:00 CET/CEST = 11:00/10:00 UTC, so 09:45 UTC is pre-gate year-round.
    - cron: "45 9 * * *"
    # Evening slot: the TSO wind/solar day-ahead forecast publishes only at
    # 18:00 CET/CEST (EEV Par. 3) - it never exists pre-gate, so the snapshot
    # captures the evening vintage. 18:30 CEST = 16:30 UTC (17:30 in winter).
    - cron: "30 16 * * *"
  # External cron services (cron-job.org) dispatch with the slot they mirror,
  # since GitHub's own schedule events are best-effort and get skipped/drifted.
  # A dispatch without a slot behaves like a generic manual run (no _late).
  workflow_dispatch:
    inputs:
      slot:
        description: "Cron slot this dispatch mirrors (UTC, e.g. 0945)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: archive-weather
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Slot-dependent behavior keys off SLOT, never github.event.schedule,
      # so external dispatches and GitHub crons act identically.
      SLOT: ${{ inputs.slot || (github.event.schedule == '45 5 * * *' && '0545') || (github.event.schedule == '0 7 * * *' && '0700') || (github.event.schedule == '0 9 * * *' && '0900') || (github.event.schedule == '45 9 * * *' && '0945') || (github.event.schedule == '30 16 * * *' && '1630') || '' }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major-version alias tags; pin the full version
      - uses: astral-sh/setup-uv@v9.0.0

      # The PyPI eccodes wheel bundles the native library on Windows but not
      # on Linux, where findlibs expects a system libeccodes.
      - name: Install ecCodes native library
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - name: Clone data repo
        run: >
          git clone
          "https://x-access-token:${{ secrets.ARCHIVE_REPO_TOKEN }}@github.com/baakflo/pred_el_prices_weather_archive.git"
          archive_repo

      - name: Install
        run: uv sync

      - name: Archive today's 00Z run
        run: uv run python -m pred_el_prices.cli archive-weather --archive-dir archive_repo

      # PEGELONLINE keeps a rolling ~31-day raw window, so any day missed
      # here is refilled automatically for a month (unlike the DWD files).
      - name: Archive Pegel Kaub
        run: uv run python -m pred_el_prices.cli archive-pegel --archive-dir archive_repo

      # Benchmark forecast for the public site. The archiver refuses to
      # write at/past the auction gate (post-gate the API serves actuals,
      # not forecasts), so the evening slot is a no-op for this step;
      # skipped snapshots are unrecoverable. Guarded so a missing
      # token doesn't block the weather/pegel push (secrets can't be used in
      # step-level `if`). The 09:45 slot additionally takes a `_late`
      # snapshot — their last pre-gate vintage, since the early snapshot may
      # predate their morning weather refresh; the archiver itself refuses
      # the late file at/past the gate, so cron drift cannot contaminate it.
      - name: Archive energyforecast.de benchmark
        env:
          ENERGYFORECAST_TOKEN: ${{ secrets.ENERGYFORECAST_TOKEN }}
        run: |
          if [ -z "$ENERGYFORECAST_TOKEN" ]; then
            echo "::warning::ENERGYFORECAST_TOKEN not set; benchmark forecast NOT archived"
            exit 0
          fi
          uv run python -m pred_el_prices.cli archive-energyforecast --archive-dir archive_repo
          if [ "$SLOT" = "0945" ]; then
            uv run python -m pred_el_prices.cli archive-energyforecast --archive-dir archive_repo --late
          fi

      # ENTSO-E serves only the latest submitted forecast version, so the
      # pre-auction vintage must be snapshotted daily. Written only once
      # both series are published; earlier slots retry via later slots.
      - name: Archive ENTSO-E day-ahead forecast snapshot
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          if [ -z "$ENTSOE_API_KEY" ]; then
            echo "::warning::ENTSOE_API_KEY not set; forecast snapshot NOT archived"
            exit 0
          fi
          uv run python -m pred_el_prices.cli archive-entsoe-forecasts --archive-dir archive_repo

      # publish-forecast and archive-ens-12z push to the same repo; a
      # non-fast-forward rejection must merge-and-retry, not drop the data.
      # always(): a crash in a later archive step (e.g. a transient ENTSO-E
      # 400) must not discard weather data already downloaded — DWD deletes
      # its files after ~24h, so a dropped push can be unrecoverable.
      - name: Push new data
        if: always()
        run: |
          cd archive_repo
          git config user.name "archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "Archive $(date -u +%F)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --no-rebase --no-edit
          done
          echo "::error::archive push failed after 3 merge retries"
          exit 1

      # Silent gaps are unrecoverable (DWD deletes files after ~24h), so a
      # missing past day must become a loud signal, not a log line.
      - name: Gap detection (previous 3 days)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd archive_repo
          missing=""
          for d in 1 2 3; do
            day=$(date -u -d "-$d day" +%Y%m%d)
            f="icon-eu-eps/${day:0:4}/icon-eu-eps_${day}00.parquet"
            [ -f "$f" ] || missing="$missing $day"
          done
          if [ -n "$missing" ]; then
            open=$(gh issue list --repo "${{ github.repository }}" --state open \
              --search "Weather archive gap" --json number --jq 'length')
            if [ "$open" = "0" ]; then
              gh issue create --repo "${{ github.repository }}" \
                --title "Weather archive gap:$missing" \
                --body "Missing daily ICON-EU-EPS parquet for:$missing. These days are likely unrecoverable (DWD keeps ~24h). Check workflow runs and fix before the gap grows."
            fi
          fi
