name: Archive ENS 12Z fallback

on:
  schedule:
    # The 12Z ENS run is on the open-data S3 bucket ~19:30-20:30 UTC. It is
    # the evening-before fallback vintage for the next morning's forecast
    # (steps +33h..+60h cover the delivery day): if the morning 00Z download
    # fails or is late, the publish workflow's retry slot uses this file
    # instead of missing the day. Two attempts; the archiver is idempotent.
    - cron: "35 20 * * *"
    - cron: "35 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-ens-12z
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install ecCodes native library
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - name: Clone data repo
        run: >
          git clone --depth 1
          "https://x-access-token:${{ secrets.ARCHIVE_REPO_TOKEN }}@github.com/baakflo/pred_el_prices_weather_archive.git"
          archive_repo

      - name: Install
        run: uv sync

      # Fails loudly if the 12Z run is not on S3 yet; the later slot retries.
      # Target date is now-12h, not today: GitHub can delay the evening
      # crons past midnight UTC (2026-08-28: fired 04:26, asked for a 12Z
      # run that wouldn't exist for 15 hours). Any firing between 12:00 UTC
      # and 11:59 UTC next day maps to the run the slot was scheduled for,
      # and a morning workflow_dispatch heals yesterday's gap.
      - name: Archive the 12Z ENS run
        run: >
          uv run python -c "from datetime import UTC, datetime, timedelta; from pathlib import Path;
          from pred_el_prices.pipeline.ecmwf import archive_run;
          archive_run((datetime.now(UTC) - timedelta(hours=12)).date(), Path('archive_repo'), run_hour=12)"

      # Push the fallback vintage IMMEDIATELY after archiving it: on
      # 2026-08-17 both slots archived the 12Z fine, then the healing step
      # below out-waited the S3 throttle until the 45-min job timeout
      # cancelled the run — and the push (then last) was skipped, losing the
      # file with the runner.
      # Same-repo pushes race with archive-weather/publish-forecast; a
      # non-fast-forward rejection must merge-and-retry, not drop the data.
      - name: Push 12Z fallback
        run: |
          cd archive_repo
          git config user.name "archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "ENS 12Z fallback $(date -u +%F)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --no-rebase --no-edit
          done
          echo "::error::12Z push failed after 3 merge retries"
          exit 1

      # Heal 00Z gaps left by throttled mornings (the bucket keeps history
      # and the evening is off-peak). Best-effort and capped so it can never
      # starve the job again: fast-fail per request instead of out-waiting
      # the throttle; a missed heal simply retries tomorrow evening.
      - name: Backfill missing recent 00Z runs
        timeout-minutes: 20
        continue-on-error: true
        env:
          PEP_ENS_RETRY_BUDGET_S: "180"
        run: >
          uv run python -m pred_el_prices.cli backfill-ecmwf
          --start "$(date -u -d '-3 day' +%F)" --archive-dir archive_repo
          || echo "::warning::00Z gap healing incomplete"

      - name: Push healed 00Z data
        run: |
          cd archive_repo
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "00Z gap healing $(date -u +%F)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --no-rebase --no-edit
          done
          echo "::error::healing push failed after 3 merge retries"
          exit 1
